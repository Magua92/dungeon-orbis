<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>{% block title %}Spedizione{% endblock %} — Orbis Terrarum</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
  html { font-size: 19px; }  /* +~19% su tutto: quasi ogni testo/spaziatura nel gioco usa rem, quindi scala qui */
  :root {
    --gold-light: #e0c068; --gold: #c4962a; --parchment: #e8dcc0; --border: #4a3d28;
    --pv: #8c2a2a; --pv-light: #c04444; --timore: #4a2a7a; --timore-light: #7a4ab0;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: radial-gradient(ellipse at top, #241c10, #0d0a06 70%); font-family:'Crimson Text',Georgia,serif; color:var(--parchment); min-height:100vh; padding:1.5rem 1rem 3rem; }
  .wrap { max-width: 820px; margin:0 auto; }
  h1,h2,h3 { font-family:'Cinzel',serif; color:var(--gold-light); }
  .panel-box { background:#1c150c88; border:1px solid var(--border); border-radius:10px; padding:1rem 1.1rem; margin-bottom:1.2rem; }
  .panel-box h3 { font-size:0.95rem; margin:0 0 0.8rem; letter-spacing:0.03em; }
  a { color: var(--gold-light); }
  .btn { display:inline-block; background:#1c150c; border:1px solid var(--border); color:var(--parchment); font-family:'Cinzel',serif; padding:0.6rem 1.4rem; border-radius:6px; cursor:pointer; font-size:0.85rem; text-decoration:none; }
  .btn:hover { border-color:var(--gold-light); }
  input[type=text], input[type=password], select { background:#0f0c06; border:1px solid var(--border); color:var(--parchment); border-radius:6px; padding:0.5rem 0.7rem; font-family:'Crimson Text',serif; font-size:0.95rem; }
  .error { color:#e08a8a; font-size:0.85rem; margin-bottom:0.8rem; }
  .bar-track { height:11px; border-radius:6px; background:#0d0a06; border:1px solid var(--border); overflow:hidden; }
  .bar-fill { height:100%; }
  .bar-fill.pv { background:linear-gradient(90deg, var(--pv), var(--pv-light)); }
  .bar-fill.timore { background:linear-gradient(90deg, var(--timore), var(--timore-light)); }
  .bar-fill.enemy-pv { background:linear-gradient(90deg, #6b1010, #a03030); }
  .bar-label { display:flex; justify-content:space-between; font-size:0.72rem; opacity:0.85; margin-bottom:0.2rem; }
  .combat-log { background:#100d0888; border:1px solid var(--border); border-radius:8px; padding:0.7rem 0.9rem; margin-bottom:1.2rem; font-size:0.85rem; }
  .combat-log div { padding:0.2rem 0; border-bottom:1px solid #4a3d2833; }
  .combat-log div:last-child { border-bottom:none; color:var(--gold-light); font-weight:600; }
  .footer-note { text-align:center; font-size:0.75rem; opacity:0.5; margin-top:2rem; }
</style>
</head>
<body>
<button id="sfx-toggle" onclick="SFX.toggleMute()" title="Attiva/disattiva effetti sonori"
        style="position:fixed;top:0.8rem;right:0.8rem;z-index:999;background:#1c150c;border:1px solid var(--border);color:var(--gold-light);border-radius:6px;padding:0.35rem 0.6rem;cursor:pointer;font-size:1rem;line-height:1">🔊</button>
<div class="wrap">
{% block content %}{% endblock %}
</div>
<script>
// Motore di effetti sonori generato via Web Audio API — nessun file audio da scaricare,
// nessun problema di copyright. Silenziabile con il pulsante in alto a destra; lo stato
// resta salvato nel browser (localStorage) tra una pagina e l'altra.
window.SFX = (function() {
  var ctx = null;
  // Quanti file reali esistono per categoria in static/sfx/ (es. hit_dealt_1.mp3,
  // hit_dealt_2.mp3, ...). Metti qui il numero giusto quando ne aggiungi/togli:
  // a 0 quella categoria usa il suono sintetizzato come prima, di riserva.
  var VARIANT_COUNTS = { hit_dealt: 5, hit_taken: 4, heal: 1, shield: 1, victory: 1, defeat: 1,
                          diaulo_amico: 1, diaulo_butta: 1, diaulo_base: 1, diaulo_signore: 1,
                          uomorsomaiale_base: 1, uomorsomaiale_sventrare: 1, uomorsomaiale_ruggito: 1,
                          doppio_colpo: 1, buff_difesa: 1 };
  var audioCache = {};
  function getCtx() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    return ctx;
  }
  function isMuted() { return localStorage.getItem('sfx_muted') === '1'; }
  function tone(freq, duration, type, gainStart, glideTo, delay) {
    var c = getCtx();
    if (!c) return;
    setTimeout(function() {
      try {
        var osc = c.createOscillator();
        var gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, c.currentTime);
        if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, c.currentTime + duration);
        gain.gain.setValueAtTime(gainStart || 0.18, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
        osc.connect(gain).connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + duration);
      } catch (e) {}
    }, delay || 0);
  }
  function noiseBurst(duration, gainStart, delay) {
    var c = getCtx();
    if (!c) return;
    setTimeout(function() {
      try {
        var bufferSize = Math.floor(c.sampleRate * duration);
        var buffer = c.createBuffer(1, bufferSize, c.sampleRate);
        var data = buffer.getChannelData(0);
        for (var i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        var src = c.createBufferSource();
        src.buffer = buffer;
        var gain = c.createGain();
        gain.gain.setValueAtTime(gainStart || 0.2, c.currentTime);
        src.connect(gain).connect(c.destination);
        src.start();
      } catch (e) {}
    }, delay || 0);
  }
  var sounds = {
    hit_dealt: function() { tone(220, 0.1, 'square', 0.15, 90); },
    hit_taken: function() { noiseBurst(0.12, 0.22); tone(110, 0.15, 'sawtooth', 0.12, 55, 10); },
    heal: function() { tone(523, 0.1, 'sine', 0.14); tone(784, 0.15, 'sine', 0.12, null, 90); },
    shield: function() { tone(300, 0.18, 'triangle', 0.14, 480); },
    victory: function() { [523, 659, 784, 1047].forEach(function(f, i) { tone(f, 0.28, 'triangle', 0.15, null, i * 110); }); },
    defeat: function() { [420, 320, 240, 160].forEach(function(f, i) { tone(f, 0.32, 'sawtooth', 0.14, null, i * 150); }); },
  };
  function playFile(name, n) {
    var key = name + '_' + n;
    var audio = audioCache[key];
    if (!audio) {
      audio = new Audio('/static/sfx/' + key + '.mp3');
      audioCache[key] = audio;
    } else {
      audio.pause();
      audio.currentTime = 0;
    }
    audio.volume = 0.6;
    audio.play().catch(function() {});
  }
  function play(name) {
    if (isMuted()) return;
    var count = VARIANT_COUNTS[name] || 0;
    if (count > 0) {
      playFile(name, 1 + Math.floor(Math.random() * count));
      return;
    }
    if (sounds[name]) sounds[name]();
  }
  function updateButton() {
    var btn = document.getElementById('sfx-toggle');
    if (btn) btn.textContent = isMuted() ? '🔇' : '🔊';
  }
  function toggleMute() {
    localStorage.setItem('sfx_muted', isMuted() ? '0' : '1');
    updateButton();
  }
  document.addEventListener('DOMContentLoaded', updateButton);
  return { play: play, toggleMute: toggleMute };
})();
</script>
{% block sound_cues %}{% endblock %}
</body>
</html>
