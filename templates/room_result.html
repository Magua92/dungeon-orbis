{% extends "base.html" %}
{% block content %}
{% include "_status.html" %}
<div class="combat-log">
  {% for line in log %}<div>{{ line }}</div>{% endfor %}
</div>
<div style="text-align:center"><a href="/room" class="btn">Prosegui →</a></div>
{% endblock %}
{% block sound_cues %}
{% if sound_cues %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  {% for cue in sound_cues %}SFX.play('{{ cue }}');
  {% endfor %}
});
</script>
{% endif %}
{% endblock %}
